name: 요즘 뜨는 명소 스냅샷

on:
  schedule:
    - cron: '0 21 * * *'   # 매일 06:00 KST (관광공사 예보가 하루 1회 갱신된 뒤)
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/trending-snapshot.mjs
        env:
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
