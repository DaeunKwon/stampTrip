<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
body{width:1024px;height:578px;overflow:hidden;font-family:"Apple SD Gothic Neo","Pretendard",-apple-system,sans-serif;background:linear-gradient(135deg,#eef3ff 0%,#dfe8ff 55%,#c0d0ff 100%);position:relative}
.dots{position:absolute;inset:0;background-image:radial-gradient(#2f5fe033 1.5px,transparent 1.5px);background-size:22px 22px;opacity:.5}
.left{position:absolute;left:72px;top:0;height:578px;display:flex;flex-direction:column;justify-content:center;width:520px}
.brand{display:flex;align-items:center;gap:20px;margin-bottom:26px}
.brand img{width:96px;height:96px;border-radius:24px;box-shadow:0 8px 24px rgba(47,95,224,.25)}
.brand h1{font-size:56px;font-weight:800;color:#1f2937;letter-spacing:-1.5px}
.tag{font-size:27px;font-weight:700;color:#2650c9;line-height:1.35;margin-bottom:18px;letter-spacing:-.5px}
.sub{font-size:18px;color:#4b5563;line-height:1.6}
.chips{display:flex;gap:10px;margin-top:26px;flex-wrap:wrap}
.chip{background:#fff;border:1.5px solid #93b0fa;color:#1e46b8;border-radius:999px;padding:8px 16px;font-size:15px;font-weight:700}
.phone{position:absolute;border-radius:36px;overflow:hidden;background:#111;box-shadow:0 30px 60px rgba(0,0,0,.28);border:8px solid #111}
.phone img{display:block;width:100%}
.p1{width:262px;height:534px;right:150px;top:60px;transform:rotate(-4deg)}
.p2{width:220px;height:448px;right:22px;top:150px;transform:rotate(5deg)}
</style></head><body>
<div class="dots"></div>
<div class="left">
  <div class="brand"><img src="icon-512.png"><h1>스탬프여행</h1></div>
  <div class="tag">다녀온 곳만 도장이 찍히는<br>GPS 방문 인증 여행 앱</div>
  <div class="sub">전국 행사·축제 정보 · 나만의 코스 만들기 · 100m 안에서만 찍히는 스탬프</div>
  <div class="chips"><span class="chip">한국관광공사 TourAPI</span><span class="chip">카카오맵</span><span class="chip">요즘 뜨는 명소</span></div>
</div>
<div class="phone p1"><img src="06-map-stamp.png"></div>
<div class="phone p2"><img src="08-my-stamps.png"></div>
</body></html>
